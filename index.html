<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#F6F4EF">
<title>2612</title>
<style>
:root{--bg:#F6F4EF;--card:#fff;--ink:#1F2340;--muted:#6E7290;--line:#ECE7DD;--blue:#3557E0;--coral:#EE7366;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#0E1121;--card:#1A1E35;--ink:#EEF0FF;--muted:#9CA2C6;--line:#2A2F4E;--blue:#7F9BFF;--coral:#FF8A7D;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;display:grid;place-items:center;padding:24px 16px calc(24px + env(safe-area-inset-bottom,0px))}
form{width:100%;max-width:320px;text-align:center}
.lock{width:64px;height:64px;margin:0 auto 18px;border-radius:20px;background:var(--card);display:grid;place-items:center;box-shadow:0 10px 24px -16px rgba(31,35,64,.45),0 0 0 1px var(--line)}
h1{font-weight:500;font-size:22px;letter-spacing:.02em;margin:0}
h1 span{color:var(--blue)}
p{margin:6px 0 22px;font:12px/1.4 ui-monospace,"SF Mono",Consolas,monospace;letter-spacing:.12em;color:var(--muted)}
input[type=password]{width:100%;height:52px;border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);font-size:22px;letter-spacing:.3em;text-align:center;outline:none}
input[type=password]:focus{border-color:var(--blue)}
button{width:100%;height:50px;margin-top:10px;border:0;border-radius:16px;background:var(--ink);color:var(--bg);font-size:16px;font-weight:600;letter-spacing:.08em;cursor:pointer}
button:disabled{opacity:.6}
label{display:flex;justify-content:center;align-items:center;gap:6px;margin-top:14px;font-size:13px;color:var(--muted)}
.err{min-height:20px;margin-top:10px;font-size:13px;color:var(--coral)}
</style>
</head>

</form>

const b64 = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function unlock(pw){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(SALT), iterations:ITER, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(IV)}, key, b64(DATA));
  return new TextDecoder().decode(plain);
}
function show(html){ document.open(); document.write(html); document.close(); }
const KEY = "trip-pass";
const f = document.getElementById("f"), go = document.getElementById("go"), err = document.getElementById("err");
f.onsubmit = async ev => {
  ev.preventDefault();
  const pw = document.getElementById("pw").value;
  go.disabled = true; go.textContent = "解鎖中…"; err.textContent = "";
  try {
    const html = await unlock(pw);
    try { if (document.getElementById("keep").checked) localStorage.setItem(KEY, pw); } catch(e) {}
    show(html);
  } catch(e) {
    go.disabled = false; go.textContent = "打開"; err.textContent = "密碼不對，再試一次";
  }
};
(async () => {
  let saved = null; try { saved = localStorage.getItem(KEY); } catch(e) {}
  if (!saved) return;
  go.disabled = true; go.textContent = "解鎖中…";
  try { show(await unlock(saved)); } catch(e) { try { localStorage.removeItem(KEY); } catch(e2) {} go.disabled = false; go.textContent = "打開"; }
})();
</script>
